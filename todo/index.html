<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .card {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    h1 { margin-top: 0; }
    input {
      padding: 10px;
      width: 65%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 14px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      background-color: #f9f9f9;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background-color: #e1e4e8;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>To-Do List</h1>

    <!-- Type a task here, then click Add -->
    <input type="text" id="task-input" placeholder="What do you need to do?">
    <button id="add-btn">Add</button>

    <!-- The tasks will be added inside this list by JavaScript -->
    <ul id="task-list"></ul>
  </div>

  <!-- Link to the external JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
