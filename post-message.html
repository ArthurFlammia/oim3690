<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Message</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    input { padding: 8px; width: 60%; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Post a Message</h1>
  <input id="message-input" placeholder="Type a message">
  <button id="send-btn">Send</button>
  <p id="result"></p>

  <script>
    // Sends one message to the class server with my token
    async function postMessage(text) {
      const result = document.getElementById("result");
      result.textContent = "Sending...";
      try {
        const response = await fetch("https://oim.zhili.dev/message", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Token": "ArthurArthur"
          },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        result.textContent = "Server replied: " + JSON.stringify(data);
      } catch (error) {
        result.textContent = "Something went wrong: " + error.message;
      }
    }

    // Extension: post whatever is typed in the box
    document.getElementById("send-btn").addEventListener("click", function () {
      const input = document.getElementById("message-input");
      if (input.value.trim() !== "") {
        postMessage(input.value.trim());
        input.value = "";
      }
    });
  </script>
</body>
</html>
