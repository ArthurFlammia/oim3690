<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .card {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 14px;
      margin-top: 15px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Temperature Converter</h1>

    <!-- The HTML form. Ask AI for this part only. -->
    <label for="celsius">Celsius (&deg;C)</label>
    <input type="number" id="celsius" placeholder="e.g. 20">

    <label for="fahrenheit">Fahrenheit (&deg;F)</label>
    <input type="number" id="fahrenheit" placeholder="e.g. 68">

    <button id="c-to-f-btn">Celsius to Fahrenheit</button>
    <button id="f-to-c-btn">Fahrenheit to Celsius</button>

    <p id="result"></p>
  </div>

  <script>
    // ===== This JavaScript was written by hand =====

    // Find the two input boxes, the two buttons, and the result line
    const celsiusInput = document.getElementById("celsius");
    const fahrenheitInput = document.getElementById("fahrenheit");
    const cToFBtn = document.getElementById("c-to-f-btn");
    const fToCBtn = document.getElementById("f-to-c-btn");
    const result = document.getElementById("result");

    // When "Celsius to Fahrenheit" is clicked
    cToFBtn.addEventListener("click", function () {
      // Read the Celsius value. Number() turns the text into a number.
      const c = Number(celsiusInput.value);
      // The formula: F = C times 9/5, plus 32
      const f = c * 9 / 5 + 32;
      // Show the answer in the Fahrenheit box and on the result line
      fahrenheitInput.value = f;
      result.textContent = c + " degrees C = " + f + " degrees F";
    });

    // When "Fahrenheit to Celsius" is clicked
    fToCBtn.addEventListener("click", function () {
      // Read the Fahrenheit value as a number
      const f = Number(fahrenheitInput.value);
      // The formula: C = (F minus 32) times 5/9
      const c = (f - 32) * 5 / 9;
      // Show the answer in the Celsius box and on the result line
      celsiusInput.value = c;
      result.textContent = f + " degrees F = " + c + " degrees C";
    });
  </script>

</body>
</html>
